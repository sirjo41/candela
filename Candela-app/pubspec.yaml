name: candela_app
description: CandelaSmart Web Client App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  mobile_scanner: ^5.1.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/candela_icon.jpg"
  adaptive_icon_background: "#1a2744"
  adaptive_icon_foreground: "assets/icon/candela_icon.jpg"

flutter:
  uses-material-design: true
